<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="1200" height="132" role="img" aria-label="NovaStream Mobile Translucent Dock Navigation">
  <defs>
    <linearGradient id="dockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0C13"/>
      <stop offset="50%" stop-color="#111320"/>
      <stop offset="100%" stop-color="#0B0C13"/>
    </linearGradient>
    <linearGradient id="activePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="128" rx="20" fill="#050508" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <text x="600" y="29" text-anchor="middle" fill="#7C8290" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="2">FIVE DEDICATED DESTINATIONS  ·  RAZOR-SHARP TRANSLUCENT DOCK</text>

  <!-- Floating Glass Dock -->
  <rect x="64" y="46" width="1072" height="66" rx="22" fill="url(#dockGrad)" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="1.2"/>

  <!-- Tab 1: Discover (Active) -->
  <rect x="82" y="54" width="196" height="50" rx="16" fill="url(#activePill)" stroke="#5E6AD2" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="114" cy="79" r="5" fill="#22D3EE"/>
  <text x="130" y="76" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Discover</text>
  <text x="130" y="93" fill="#B5BCF7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">3D Carousel &amp; Search</text>

  <!-- Tab 2: Hindi -->
  <rect x="292" y="54" width="196" height="50" rx="16" fill="#F59E0B" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="324" cy="79" r="5" fill="#F59E0B"/>
  <text x="340" y="76" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Hindi Dub</text>
  <text x="340" y="93" fill="#B59B62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Isolated Multi-Season</text>

  <!-- Tab 3: Library -->
  <rect x="502" y="54" width="196" height="50" rx="16" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="534" cy="79" r="5" fill="#10B981"/>
  <text x="550" y="76" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Library</text>
  <text x="550" y="93" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Watchlist &amp; Vault</text>

  <!-- Tab 4: Stats -->
  <rect x="712" y="54" width="196" height="50" rx="16" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="744" cy="79" r="5" fill="#8B95F6"/>
  <text x="760" y="76" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Stats</text>
  <text x="760" y="93" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Streaks &amp; Milestones</text>

  <!-- Tab 5: Settings -->
  <rect x="922" y="54" width="196" height="50" rx="16" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="954" cy="79" r="5" fill="#8A8F98"/>
  <text x="970" y="76" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Settings</text>
  <text x="970" y="93" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Studio &amp; Storage</text>
</svg>
