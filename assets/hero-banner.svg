<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="NovaStream Mobile Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020203"/>
      <stop offset="55%" stop-color="#060711"/>
      <stop offset="100%" stop-color="#03050B"/>
    </linearGradient>
    <radialGradient id="indigoGlow" cx="22%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#5E6AD2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="82%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="52%" stop-color="#5E6AD2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B95F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10121E" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#07080D" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141833"/>
      <stop offset="55%" stop-color="#0A0D1C"/>
      <stop offset="100%" stop-color="#071923"/>
    </linearGradient>
    <linearGradient id="topStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#5E6AD2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="cinemaGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Cinema Canvas -->
  <rect x="2" y="2" width="1196" height="426" rx="24" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="426" rx="24" fill="url(#cinemaGrid)"/>
  <rect x="2" y="2" width="1196" height="426" rx="24" fill="url(#indigoGlow)"/>
  <rect x="2" y="2" width="1196" height="426" rx="24" fill="url(#cyanGlow)"/>

  <!-- Subtle top cinema highlight line -->
  <path d="M 80 3 L 1120 3" stroke="url(#topStroke)" stroke-width="2" stroke-linecap="round"/>

  <!-- Orbital Vector Emblem echoing app icon -->
  <g transform="translate(64, 58)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#0B101D" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>
    <circle cx="38" cy="38" r="24" fill="none" stroke="url(#brandGrad)" stroke-width="3.6" stroke-opacity="0.88"/>
    <ellipse cx="38" cy="38" rx="30" ry="12" transform="rotate(-42 38 38)" fill="none" stroke="url(#brandGrad)" stroke-width="3.8"/>
    <polygon points="32,26 32,50 51,38" fill="none" stroke="url(#brandGrad)" stroke-width="3.8" stroke-linejoin="round"/>
  </g>

  <!-- Eyebrow Tag -->
  <g transform="translate(158, 76)">
    <rect x="0" y="0" width="272" height="28" rx="14" fill="#5E6AD2" fill-opacity="0.14" stroke="#5E6AD2" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#22D3EE"/>
    <text x="28" y="18.5" fill="#C7CEFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4">DARK CINEMA ANDROID CLIENT</text>
  </g>
  <text x="158" y="124" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.4">Standalone Native Experience  ·  Zero Desktop Dependency</text>

  <!-- Main Title -->
  <text x="64" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#EDEDEF">NovaStream </tspan>
    <tspan fill="url(#titleGrad)">Mobile</tspan>
  </text>

  <!-- Subtitle -->
  <text x="64" y="246" fill="#9AA0AC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400">
    Cinema-grade 1080p HLS streaming, tri-audio catalog, and offline episode vault.
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(64, 286)">
    <rect x="0" y="0" width="144" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    <text x="72" y="20.5" text-anchor="middle" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">1080p Media3 HLS</text>

    <rect x="154" y="0" width="142" height="32" rx="10" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1"/>
    <text x="225" y="20.5" text-anchor="middle" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Sub · Eng · Hindi</text>

    <rect x="306" y="0" width="142" height="32" rx="10" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.35" stroke-width="1"/>
    <text x="377" y="20.5" text-anchor="middle" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Offline Vault MP4</text>

    <rect x="458" y="0" width="130" height="32" rx="10" fill="#5E6AD2" fill-opacity="0.14" stroke="#5E6AD2" stroke-opacity="0.40" stroke-width="1"/>
    <text x="523" y="20.5" text-anchor="middle" fill="#C7CEFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Closed Source</text>
  </g>

  <!-- Bottom Meta Footer -->
  <line x1="64" y1="354" x2="660" y2="354" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <text x="64" y="382" fill="#7C8290" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="1.4">JETPACK COMPOSE  ·  MIN SDK 24  ·  v1.0.0 STANDALONE EDITION</text>

  <!-- Right Stylized Player Frame Card -->
  <g transform="translate(722, 46)">
    <!-- Soft outer ambient glow -->
    <rect x="14" y="14" width="388" height="312" rx="22" fill="#5E6AD2" fill-opacity="0.14" filter="url(#softBlur)"/>
    <!-- Device Card Shell -->
    <rect x="0" y="0" width="414" height="338" rx="22" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>

    <!-- Top Status Row inside Card -->
    <circle cx="24" cy="26" r="4.5" fill="#10B981"/>
    <text x="36" y="30" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.4">CINEMA PLAYER ENGINE</text>
    <rect x="316" y="14" width="76" height="24" rx="8" fill="#5E6AD2" fill-opacity="0.22" stroke="#5E6AD2" stroke-opacity="0.55" stroke-width="1"/>
    <text x="354" y="30" text-anchor="middle" fill="#DDE1FF" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700">1080p HD</text>

    <!-- 16:9 Viewport Preview -->
    <rect x="20" y="50" width="374" height="176" rx="14" fill="url(#screenGrad)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="207" cy="138" r="46" fill="#5E6AD2" fill-opacity="0.16" stroke="#5E6AD2" stroke-opacity="0.40" stroke-width="1.2"/>
    <circle cx="207" cy="138" r="30" fill="#0B101D" stroke="url(#brandGrad)" stroke-width="2.5"/>
    <polygon points="200,126 200,150 220,138" fill="url(#brandGrad)"/>

    <!-- Audio Pills inside Player Viewport -->
    <rect x="34" y="64" width="70" height="22" rx="7" fill="#020203" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
    <text x="69" y="79" text-anchor="middle" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700">SUB / DUB</text>

    <rect x="112" y="64" width="54" height="22" rx="7" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-opacity="0.50" stroke-width="1"/>
    <text x="139" y="79" text-anchor="middle" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700">HINDI</text>

    <rect x="298" y="190" width="82" height="22" rx="7" fill="#020203" fill-opacity="0.78" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1"/>
    <text x="339" y="205" text-anchor="middle" fill="#67E8F9" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700">SKIP +85s</text>

    <!-- Progress Scrubber -->
    <rect x="20" y="246" width="374" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="20" y="246" width="268" height="5" rx="2.5" fill="url(#brandGrad)"/>
    <circle cx="288" cy="248.5" r="6.5" fill="#EDEDEF" stroke="#5E6AD2" stroke-width="2.5"/>
    <text x="20" y="270" fill="#8A8F98" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">16:42</text>
    <text x="394" y="270" text-anchor="end" fill="#8A8F98" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">23:54</text>

    <!-- Control Strip -->
    <rect x="20" y="286" width="84" height="30" rx="9" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="62" y="305" text-anchor="middle" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">PiP Mode</text>

    <rect x="114" y="286" width="94" height="30" rx="9" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="161" y="305" text-anchor="middle" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">1.0x Speed</text>

    <rect x="218" y="286" width="90" height="30" rx="9" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="263" y="305" text-anchor="middle" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">CC Studio</text>

    <rect x="318" y="286" width="76" height="30" rx="9" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.40"/>
    <text x="356" y="305" text-anchor="middle" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">Offline</text>
  </g>
</svg>
